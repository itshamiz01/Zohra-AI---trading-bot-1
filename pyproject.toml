[project]
name = "zohra-ai-trading-bot"
version = "1.0.0"
description = "Zohra AI - autonomous multi-agent Forex & XAUUSD trading engine with a FastAPI command-center dashboard (MetaTrader 5, paper trading)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pytz>=2024.1",
    "matplotlib>=3.8.0",
    "groq>=0.4.0",
]

[tool.vercel]
entrypoint = "zohra.api.app:app"
